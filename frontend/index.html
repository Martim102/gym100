<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym100% — Entrar</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="pagina-auth">
    <div class="auth-lado-visual">
        <div>
            <h1>Treina. Regista.<br>Compete com os <span>teus</span>.</h1>
            <p>O Gym100% junta o teu treino, a tua alimentação e os teus amigos num único sítio. Sem desculpas, só resultados.</p>
        </div>
    </div>

    <div class="auth-lado-form">
        <h2 style="margin-bottom: 6px;">Entrar na conta</h2>
        <p style="color: var(--cinza); margin-bottom: 28px;">Ainda não tens conta? <a href="registo.html">Cria uma aqui</a></p>

        <div class="mensagem-erro" id="caixaErro"></div>

        <form id="formularioLogin">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="campo">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="botao botao-principal" style="width:100%; margin-top: 8px;">Entrar</button>
        </form>
    </div>
</div>

<script src="js/comum.js"></script>
<script>
document.getElementById("formularioLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const caixaErro = document.getElementById("caixaErro");
    try {
        await chamarApi("/auth/login.php", {
            method: "POST",
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });
        window.location.href = "paginas/dashboard.html";
    } catch (erro) {
        mostrarErro(caixaErro, erro.message);
    }
});
</script>
</body>
</html>
