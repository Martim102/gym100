<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym100% — Criar conta</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="pagina-auth">
    <div class="auth-lado-visual">
        <div>
            <h1>A tua evolução,<br>com <span>números</span> à frente.</h1>
            <p>Regista treinos, pesa-te, planeia as refeições e desafia os teus amigos para veres quem chega mais longe este mês.</p>
        </div>
    </div>

    <div class="auth-lado-form">
        <h2 style="margin-bottom: 6px;">Criar conta</h2>
        <p style="color: var(--cinza); margin-bottom: 28px;">Já tens conta? <a href="index.html">Entra aqui</a></p>

        <div class="mensagem-erro" id="caixaErro"></div>

        <form id="formularioRegisto">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="campo">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" required minlength="6" autocomplete="new-password">
                <span style="font-size:0.78rem; color: var(--cinza);">Mínimo 6 caracteres.</span>
            </div>
            <button type="submit" class="botao botao-principal" style="width:100%; margin-top: 8px;">Criar a minha conta</button>
        </form>
    </div>
</div>

<script src="js/comum.js"></script>
<script>
document.getElementById("formularioRegisto").addEventListener("submit", async (e) => {
    e.preventDefault();
    const caixaErro = document.getElementById("caixaErro");
    try {
        await chamarApi("/auth/registo.php", {
            method: "POST",
            body: JSON.stringify({
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });
        window.location.href = "paginas/dashboard.html";
    } catch (erro) {
        mostrarErro(caixaErro, erro.message);
    }
});
</script>
</body>
</html>
